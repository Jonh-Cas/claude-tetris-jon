<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="topbar">
      <h1 class="game-title">TETRIS</h1>
      <div class="theme-toggle">
        <span class="theme-label">CLARO</span>
        <label class="switch">
          <input type="checkbox" id="theme-switch" aria-label="Alternar modo claro/oscuro" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div id="panel-start" class="overlay-box hidden">
        <p class="overlay-heading">TETRIS</p>
        <p class="overlay-sub">Pulsa Jugar para comenzar</p>
        <button id="start-btn" class="menu-btn">Jugar</button>
      </div>

      <div id="panel-pause" class="overlay-box hidden">
        <p class="overlay-heading">PAUSA</p>
        <button id="resume-btn" class="menu-btn">Reanudar</button>
        <button id="restart-btn" class="menu-btn menu-btn-secondary">Reiniciar</button>
        <button id="controls-btn" class="menu-btn menu-btn-secondary">Ver controles</button>
        <div class="level-select-row">
          <label for="start-level-select">Nivel inicial</label>
          <select id="start-level-select" aria-label="Nivel inicial"></select>
        </div>
      </div>

      <div id="panel-controls" class="overlay-box hidden">
        <p class="overlay-heading">CONTROLES</p>
        <ul class="overlay-controls-list">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
        <button id="back-btn" class="menu-btn menu-btn-secondary">Volver</button>
      </div>

      <div id="panel-gameover" class="overlay-box hidden">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="gameover-restart-btn" class="menu-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
